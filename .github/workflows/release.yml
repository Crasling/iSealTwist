name: Release AddOn

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for tags

      - name: Validate Version and Prepare Changelog
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          toc_version=$(awk -F': *' '/^## Version:/{print $2; exit}' iSealTwist.toc)

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$release_version" != "$toc_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc_version" >&2
            exit 1
          fi

          awk -v header="v$release_version" '
            $1 == header { found=1; next }
            found && $1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.txt > .release-changelog.md

          if [[ ! -s .release-changelog.md ]]; then
            echo "No changelog section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build and Publish Release
        uses: BigWigsMods/packager@v2
        with:
          args: -m .pkgmeta
